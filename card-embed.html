<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- CSP: ana uygulamanınkinden DAR. Bu sayfa kimlik doğrulaması yapmıyor ve
         Graph'a çıkmıyor, bu yüzden login.microsoftonline.com / graph.microsoft.com
         connect-src'te YOK. style-src'teki 'unsafe-inline' ZORUNLU (React satır içi
         style niteliği kullanıyor). img-src'te data: + blob: gerekli: logolar base64,
         kart tuvali blob üretiyor, fotoğraf Thub'dan data URI olarak geliyor. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'none';" />
    <title>Dijital Kartvizit</title>
    <!-- Yalnız kartın KULLANDIĞI fontlar ve ağırlıklar: gövde/ünvan Inter 400+600,
         ad satırı Plus Jakarta Sans 700 (businessCardV2.js'teki ctx.font değerleri).
         Ana uygulamanın font listesi daha geniş (Baloo 2 giriş ekranı için) — embed'e
         gereksiz ağırlık indirmiyoruz. Kart ölçüleri font metriğine bağlı olduğu için
         çizimden önce document.fonts.ready bekleniyor (zaman aşımlı, CardEmbed.jsx). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Plus+Jakarta+Sans:wght@700&display=swap" />
    <style>
      /* Gömülü sayfa: tarayıcının varsayılan 8px gövde boşluğu kartı dar ekranda
         gereksiz küçültüyor ve WebView'da kenarda şerit bırakıyordu. */
      html, body { margin: 0; padding: 0; background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/embed.jsx"></script>
  </body>
</html>
